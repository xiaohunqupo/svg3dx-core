# Generates cpp/include/svg3dx.h — run via scripts/generate-c-header.ps1
language = "C"
cpp_compat = true
include_guard = "SVG3DX_H"
autogen_warning = "/* Generated by cbindgen. Do not edit by hand. */"
documentation = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true
include_version = false
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

after_includes = """

typedef struct Svg3dxResult Svg3dxResult;
typedef struct Svg3dxSession Svg3dxSession;
"""

[export]
# Opaque structs are declared in after_includes (they hold Rust-only fields).
include = [
    "svg3dx_parse",
    "svg3dx_parse_with_params",
    "svg3dx_result_ok",
    "svg3dx_result_json",
    "svg3dx_result_len",
    "svg3dx_result_warning_count",
    "svg3dx_free_result",
    "svg3dx_session_open",
    "svg3dx_session_patch_params",
    "svg3dx_session_set_params",
    "svg3dx_session_set_model",
    "svg3dx_session_reload",
    "svg3dx_session_evaluate",
    "svg3dx_session_revision",
    "svg3dx_session_free",
]
item_types = ["functions", "typedefs"]

[parse]
parse_deps = false
clean = false

[fn]
sort_by = "None"
