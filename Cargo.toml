[workspace]
resolver = "2"
members = [
    "crates/svg3dx-core",
    "crates/svg3dx-ffi-c",
    "crates/svg3dx-ffi-wasm",
]
default-members = ["crates/svg3dx-core"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR MulanPSL-2.0"
authors = ["danny许"]

[workspace.dependencies]
svg3dx-core = { path = "crates/svg3dx-core" }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
